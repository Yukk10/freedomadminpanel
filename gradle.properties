org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# Версии. Меняй версию только той части, которую правил, и обязательно
# подними release_version — по ней CI создаёт новый релиз (тег v<release_version>).
# В каждый релиз всегда кладутся все три jar с их текущими версиями.
# ---------------------------------------------------------------------------
release_version=1.0.0
velocity_version=1.0.0
paper_version=1.0.0
fabric_version=1.0.0

# Протокол мод <-> Velocity (менять одновременно в обеих частях, если меняется формат пакетов)
protocol_version=1

# Fabric (https://fabricmc.net/develop)
minecraft_version=1.21.10
yarn_mappings=1.21.10+build.3
loader_version=0.19.5
fabric_api_version=0.138.4+1.21.10

# Серверные API
velocity_api_version=3.4.0
paper_api_version=1.21.10-R0.1-SNAPSHOT
mariadb_version=3.5.10
litebans_api_version=0.6.1
skinsrestorer_api_version=15.11.0
